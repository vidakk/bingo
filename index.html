<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skupštinski Bingo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Skupštinski Bingo</h1>
      <p class="hint">
        Nasumičan listić, <span id="pool">0</span> tema u špilu. Klik na kvadrat ga označava. Sredina je slobodna.
      </p>
      <div class="toolbar">
        <button type="button" id="new-card">Novi listić</button>
        <button type="button" id="clear-marks">Poništi oznake</button>
        <button type="button" id="print">Štampaj</button>
      </div>
      <div id="banner" class="banner" hidden></div>
      <div class="letters" aria-hidden="true">
        <span>B</span>
        <span>I</span>
        <span>N</span>
        <span>G</span>
        <span>O</span>
      </div>
      <div id="card" class="card"></div>
      <p id="status" class="status"></p>
    </main>
    <script src="themes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
